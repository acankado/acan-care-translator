name: Deploy Azure Speech TTS backend (manual)

# Manual-only until authentication, limits and Azure OIDC trust are verified.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-acan-care-tts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-tts-poc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Functions dependencies
        working-directory: azure-tts
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy only azure-tts folder
        uses: Azure/functions-action@v1
        with:
          app-name: acan-care-tts-api
          package: ./azure-tts
